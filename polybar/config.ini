[colors]
background = #1a1b26
background-alt = #24283b
foreground = #c0caf5
primary = #7aa2f7
secondary = #9ece6a
alert = #f7768e
disabled = #565f89

[bar/example]
width = 100%
height = 28pt
radius = 8
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2pt
border-size = 4pt
border-color = #00000000
padding-left = 1
padding-right = 1
module-margin = 1
separator = "  "
font-0 = JetBrainsMono Nerd Font:size=10;2
modules-left = cachyos openbox xworkspaces xwindow
modules-right = pulseaudio memory cpu wlan battery date
cursor-click = pointer
enable-ipc = true

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.background-alt}
label-active-foreground = ${colors.primary}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:45:...%
label-foreground = ${colors.foreground}

[module/pulseaudio]
click-left = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
scroll-up = wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
scroll-down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
type = internal/pulseaudio
format-volume = "  <label-volume>"
label-volume = %percentage%%
label-muted = " muted"
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 3
format = "  <label>"
label = %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 2
format = "  <label>"
label = %percentage%%

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3
label-connected = "  %essid%"
label-disconnected = "睊 offline"
label-disconnected-foreground = ${colors.disabled}

[module/date]
type = internal/date
interval = 1
date = %a %b %d
time = %H:%M
label = "  %date%  %time%"

[module/desk1]
type = custom/text
content = "1"
content-padding = 1
click-left = wmctrl -s 0

[module/desk2]
type = custom/text
content = "2"
content-padding = 1
click-left = wmctrl -s 1

[module/desk3]
type = custom/text
content = "3"
content-padding = 1
click-left = wmctrl -s 2

[module/desk4]
type = custom/text
content = "4"
content-padding = 1
click-left = wmctrl -s 3

[module/cachyos]
type = custom/text
content = "  CACHYOS"
content-foreground = ${colors.primary}
content-padding = 1

[module/openbox]
type = custom/text
content = "  OPENBOX"
content-foreground = ${colors.foreground}
content-padding = 1

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
format-charging = "  <label-charging>"
format-discharging = "  <label-discharging>"
format-full = "  <label-full>"
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
